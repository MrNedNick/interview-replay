<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Review interview recordings in the browser: note moments on a timeline, tag and search them, cut highlight reels and back findings with the moments that show them." />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6cf6'/%3E%3Cpath d='M7 20h3v-8H7zm5 4h3V8h-3zm5-6h3v-4h-3zm5 3h3V11h-3z' fill='white'/%3E%3C/svg%3E" />
    <title>Interview Replay</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme (themeScript in src/lib/core/theme.ts).
      (function(){var t;try{t=localStorage.getItem("interview-replay-theme")}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var r=document.documentElement;r.classList.add(t);r.style.colorScheme=t})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
